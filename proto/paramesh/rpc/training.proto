syntax = "proto3";
package paramesh.v1;

enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  SYNCHRONOUS = 1;
  ASYNCHRONOUS = 2;
  BOUNDED_STALENESS = 3;
}

enum Aggregation {
  MEAN = 0;
  SUM = 1;
}

message Empty {}

message RunConfig {
  string run_id = 1;
  SyncMode mode = 2;
  repeated string shard_endpoints = 3;
  repeated string worker_ids = 4;
  uint32 max_staleness = 5;
  double learning_rate = 6;
  double barrier_timeout_seconds = 7;
  Aggregation aggregation = 8;
}

message RegisterWorkerRequest {
  string worker_id = 1;
  uint32 protocol_version = 2;
}

message WorkerSession {
  string session_id = 1;
  RunConfig config = 2;
  uint64 generation = 3;
}

message HeartbeatRequest {
  string run_id = 1;
  string worker_id = 2;
  string session_id = 3;
  uint64 step = 4;
  uint64 parameter_version = 5;
  bool completed = 6;
}

message WorkerState {
  string worker_id = 1;
  string health = 2;
  uint64 step = 3;
  uint64 parameter_version = 4;
  double heartbeat_age_seconds = 5;
  uint64 generation = 6;
  uint64 checkpoint_epoch = 7;
  string checkpoint_id = 8;
  string checkpoint_phase = 9;
  bool checkpoint_committed = 10;
}

message RunStatus {
  RunConfig config = 1;
  repeated WorkerState workers = 2;
  uint64 global_step = 3;
}

// Canonical little-endian float32 bytes. No pickle or executable object format.
message Tensor {
  string name = 1;
  repeated uint64 shape = 2;
  string dtype = 3;
  bytes data = 4;
}

message PullRequest { string run_id = 1; }
message Parameters {
  uint64 version = 1;
  repeated Tensor tensors = 2;
}

message GradientUpdate {
  string run_id = 1;
  string worker_id = 2;
  uint64 step = 3;
  uint64 base_version = 4;
  repeated Tensor tensors = 5;
  uint64 generation = 6;
}

message UpdateResult {
  uint64 version = 1;
  uint64 staleness = 2;
  bool duplicate = 3;
}

message UpdateReceipt {
  string worker_id = 1;
  uint64 step = 2;
  bytes digest = 3;
  uint64 version = 4;
  uint64 staleness = 5;
}

// Durable state is data-only protobuf, never a Python object serialization.
message ShardSnapshot {
  uint32 format_version = 1;
  bytes config_fingerprint = 2;
  bytes model_fingerprint = 3;
  string optimizer = 4;
  uint64 version = 5;
  repeated Tensor parameters = 6;
  repeated UpdateReceipt receipts = 7;
  map<string, uint64> worker_generations = 8;
  uint64 checkpoint_epoch = 9;
  bool checkpoint_frozen = 10;
}

message FenceRequest {
  string run_id = 1;
  string worker_id = 2;
  uint64 generation = 3;
}

message ShardProgress {
  uint64 version = 1;
  map<string, uint64> next_steps = 2;
  map<string, uint64> worker_generations = 3;
  repeated string pending_workers = 4;
}

message WorkerJournal {
  uint32 format_version = 1;
  bytes config_fingerprint = 2;
  string worker_id = 3;
  uint64 next_step = 4;
  repeated GradientUpdate requests = 5;
  double loss = 6;
}

enum CheckpointPhase {
  CHECKPOINT_RUNNING = 0;
  CHECKPOINT_REQUESTED = 1;
  CHECKPOINT_FROZEN = 2;
  CHECKPOINT_COMMITTED = 3;
  CHECKPOINT_RESUMING = 4;
  CHECKPOINT_ABORTING = 5;
}

message CheckpointRequest {
  string run_id = 1;
  string checkpoint_id = 2;
  string worker_id = 3;
}

message CheckpointControl {
  uint64 epoch = 1;
  string checkpoint_id = 2;
  CheckpointPhase phase = 3;
  bool committed = 4;
}

message CheckpointAck {
  string run_id = 1;
  string worker_id = 2;
  string session_id = 3;
  uint64 epoch = 4;
  uint64 step = 5;
  uint64 parameter_version = 6;
  bytes worker_journal = 7;
}

message CheckpointWorkerRecord {
  string worker_id = 1;
  uint64 generation = 2;
  uint64 step = 3;
  bytes worker_journal = 4;
}

message CheckpointEpochStatus {
  CheckpointControl control = 1;
  bool all_workers_acknowledged = 2;
  repeated CheckpointWorkerRecord workers = 3;
  bool committed = 4;
}

message CheckpointPhaseRequest {
  string run_id = 1;
  uint64 epoch = 2;
  CheckpointPhase phase = 3;
}

message CheckpointSnapshot {
  bytes snapshot = 1;
}

message ShardCheckpointRequest {
  string run_id = 1;
  uint64 epoch = 2;
}

service Coordinator {
  rpc RegisterWorker(RegisterWorkerRequest) returns (WorkerSession);
  rpc Heartbeat(HeartbeatRequest) returns (WorkerState);
  rpc GetStatus(Empty) returns (RunStatus);
  rpc BeginCheckpoint(CheckpointRequest) returns (CheckpointEpochStatus);
  rpc GetCheckpointStatus(CheckpointRequest) returns (CheckpointEpochStatus);
  rpc AcknowledgeCheckpoint(CheckpointAck) returns (CheckpointEpochStatus);
  rpc GetCheckpointControl(CheckpointRequest) returns (CheckpointControl);
  rpc SetCheckpointPhase(CheckpointPhaseRequest) returns (CheckpointEpochStatus);
  rpc GetCheckpointSnapshot(CheckpointRequest) returns (CheckpointSnapshot);
}

service ParameterShard {
  rpc PullParameters(PullRequest) returns (Parameters);
  rpc PushGradients(GradientUpdate) returns (UpdateResult);
  rpc GetProgress(PullRequest) returns (ShardProgress);
  rpc FenceWorker(FenceRequest) returns (Empty);
  rpc FreezeCheckpoint(ShardCheckpointRequest) returns (Empty);
  rpc UnfreezeCheckpoint(ShardCheckpointRequest) returns (Empty);
  rpc ExportCheckpointSnapshot(ShardCheckpointRequest) returns (CheckpointSnapshot);
}
