name: Immutable image

on:
  push:
    tags: ["image-*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact 40-character commit SHA to build"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ -n "$SOURCE_REF" && ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be an exact commit SHA" >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [[ -n "$SOURCE_REF" && "$sha" != "$SOURCE_REF" ]]; then
            echo "checked-out commit differs from source_ref" >&2
            exit 1
          fi
          git diff --quiet && git diff --cached --quiet
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/paramesh:sha-${{ steps.source.outputs.sha }}
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.sha }}
            BUILD_DATE=${{ steps.source.outputs.created }}
            SOURCE_DIRTY=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
      - name: Record immutable release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/paramesh:sha-${{ steps.source.outputs.sha }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p artifacts
          python scripts/immutable_release.py record \
            --image-ref "$IMAGE_REF" \
            --digest "$IMAGE_DIGEST" \
            --source-commit "$SOURCE_COMMIT" \
            --output artifacts/immutable-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-release-${{ steps.source.outputs.sha }}
          path: artifacts/immutable-release.json
