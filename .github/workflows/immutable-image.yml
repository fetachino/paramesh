name: Immutable image

on:
  push:
    tags: ["image-*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact commit or ref to build"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/paramesh:sha-${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            SOURCE_DIRTY=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/paramesh:sha-${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          python scripts/immutable_release.py record \
            --image-ref "$IMAGE_REF" \
            --digest "$IMAGE_DIGEST" \
            --source-commit "$SOURCE_COMMIT" \
            --output artifacts/immutable-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-release-${{ github.sha }}
          path: artifacts/immutable-release.json
