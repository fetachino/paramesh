name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish trusted package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected release ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked build tool
        run: python -m pip install uv==0.13.6

      - name: Require a matching immutable version tag
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Package publication must run from a version tag" >&2; exit 1 ;;
          esac
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "Tag $tag_version does not match package version $package_version" >&2
            exit 1
          }

      - name: Build the exact checked-out source
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev python -m build

      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
