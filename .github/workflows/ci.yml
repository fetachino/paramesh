name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,train,storage,operations]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: node --check src/paramesh/web/app.js
      - run: python scripts/generate_proto.py --check
      - run: python scripts/generate_grafana.py
      - run: git diff --exit-code -- ops/grafana/dashboards/paramesh.json
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - run: python -m build
      - run: python scripts/create_dev_env.py
      - run: docker compose config --quiet
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --vulnerability-service osv
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/create_dev_env.py
      - run: docker compose build
      - run: python scripts/verify_compose.py
      - run: python scripts/verify_operations.py --isolated
      - uses: actions/upload-artifact@v4
        with:
          name: container-evidence
          path: artifacts/*verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: operations-evidence
          path: artifacts/operations-stack.json
