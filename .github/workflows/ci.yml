name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,train]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python scripts/generate_proto.py --check
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - run: python -m build
      - run: docker compose config --quiet
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --vulnerability-service osv
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Require both independent workers to complete
        run: |
          for service in worker-0 worker-1; do
            container=$(docker compose ps -aq "$service")
            test -n "$container"
            status=$(timeout 180 docker wait "$container")
            test "$status" = 0
          done
          docker compose exec -T coordinator paramesh status --coordinator coordinator:50050
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --remove-orphans
