name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install uv==0.13.6
      - run: uv lock --check
      - run: uv sync --locked --all-extras
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: node --check src/paramesh/web/app.js
      - run: python scripts/generate_proto.py --check
      - run: python scripts/generate_grafana.py
      - run: git diff --exit-code -- ops/grafana/dashboards/paramesh.json
      - run: |
          mkdir -p artifacts
          python -m pytest --cov --cov-report=term-missing --cov-report=xml --basetemp artifacts/test-runs
      - name: Verify minimal benchmark extras
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/paramesh-benchmark
        run: |
          uv sync --locked --extra train --extra benchmark
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m paramesh.cli benchmark --output artifacts/benchmark-extras --modes sync --workers 1 --shards 1 --repetitions 1 --warmup-steps 1 --steps 2
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m paramesh.cli recovery-benchmark --output artifacts/recovery-extras --repetitions 1
      - run: python -m build
      - run: python scripts/create_dev_env.py
      - run: docker compose config --quiet
      - name: Verify immutable Compose override
        run: |
          PARAMESH_IMAGE="ghcr.io/fetachino/paramesh@sha256:$(printf 'a%.0s' {1..64})" \
            python scripts/verify_immutable_compose.py
          python scripts/immutable_release.py record \
            --image-ref ghcr.io/fetachino/paramesh:ci-${GITHUB_SHA} \
            --digest "sha256:$(printf 'b%.0s' {1..64})" \
            --source-commit "$(git rev-parse HEAD)" \
            --output artifacts/immutable-release.json
      - run: python -m pip_audit --vulnerability-service osv
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-dependency-contract-smoke
          path: |
            artifacts/benchmark-extras
            artifacts/recovery-extras
      - uses: actions/upload-artifact@v4
        with:
          name: azure-checkpoint-evidence
          path: artifacts/test-runs/test_azure_partial*/azure-verification.json
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/create_dev_env.py
      - run: docker compose build
      - run: python scripts/verify_compose.py
      - run: python scripts/verify_operations.py --isolated
      - run: python scripts/verify_operations.py --multihost-simulation --output artifacts/multihost-simulation.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-evidence
          path: |
            artifacts/*verification.json
            artifacts/multihost-simulation.json
      - uses: actions/upload-artifact@v4
        with:
          name: operations-evidence
          path: artifacts/operations-stack.json
