name: Bug report
description: Report a reproducible ParamMesh defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not post passwords, tokens, private keys, sensitive logs, or unredacted production data. For security vulnerabilities, follow SECURITY.md instead."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal reproduction, commands, and non-sensitive configuration.
      placeholder: "1. Configure ...\n2. Run ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and revision
      description: OS, Python version, deployment type, training mode, and commit SHA.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence (redacted)
      description: Include relevant sanitized logs, tests, or metrics.
      render: shell
    validations:
      required: false
