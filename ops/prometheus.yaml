global:
  scrape_interval: 2s
  evaluation_interval: 5s
scrape_configs:
  - job_name: dashboard
    static_configs:
      - targets: [dashboard:9100]
        labels: {component: dashboard}
  - job_name: coordinator
    static_configs:
      - targets: [coordinator:9100]
        labels: {component: coordinator}
  - job_name: shards
    static_configs:
      - targets: [shard-0:9100]
        labels: {component: shard-0}
      - targets: [shard-1:9100]
        labels: {component: shard-1}
  - job_name: workers
    static_configs:
      - targets: [worker-0:9100]
        labels: {component: worker-0}
      - targets: [worker-1:9100]
        labels: {component: worker-1}
