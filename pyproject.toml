[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paramesh"
version = "0.1.0"
description = "An explicit parameter-server training protocol with independently running services"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["grpcio==1.76.0", "protobuf==6.33.5", "numpy==2.3.4"]

[project.optional-dependencies]
dev = ["grpcio-tools==1.76.0", "pytest==9.0.3", "pytest-cov==7.0.0", "ruff==0.14.3", "mypy==1.18.2", "build==1.3.0"]
train = ["torch==2.15.0"]
storage = ["boto3==1.43.123"]

[project.scripts]
paramesh = "paramesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paramesh = ["py.typed", "rpc/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["distributed: independently spawned processes over loopback gRPC"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/paramesh/rpc/*_pb2*.py", "src/paramesh/rpc/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/paramesh"]
exclude = ["rpc/.*_pb2"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "paramesh.rpc.*", "google.protobuf.json_format", "boto3", "botocore.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["paramesh"]
omit = ["*/rpc/*", "*/cli.py"]
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
show_missing = true
fail_under = 90
