x-common: &common
  build: .
  image: paramesh:local
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [training]
  environment: &worker-environment
    PARAMESH_RPC_TOKEN: ${PARAMESH_RPC_TOKEN:?Generate .env with scripts/create_dev_env.py}

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    profiles: [storage]
    entrypoint: [/bin/sh, -ec]
    command:
      - 'test -n "$$AWS_ACCESS_KEY_ID"; test -n "$$AWS_SECRET_ACCESS_KEY"; exec weed mini -dir=/data -ip=seaweedfs -volume.max=1'
    environment:
      AWS_ACCESS_KEY_ID: ${PARAMESH_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${PARAMESH_S3_SECRET_KEY:-}
      S3_BUCKET: paramesh-checkpoints
    restart: unless-stopped
    volumes: [object-storage:/data]
    networks: [storage]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  checkpoint:
    <<: *common
    profiles: [maintenance]
    networks: [storage, management]
    environment:
      PARAMESH_S3_ACCESS_KEY: ${PARAMESH_S3_ACCESS_KEY:-}
      PARAMESH_S3_SECRET_KEY: ${PARAMESH_S3_SECRET_KEY:-}
    command: [checkpoint, export, --id, manual, --state-dir, /cluster, --store, /checkpoints]
    volumes:
      - coordinator-state:/cluster/coordinator
      - shard-0-state:/cluster/shard-0
      - shard-1-state:/cluster/shard-1
      - worker-0-state:/cluster/worker-0
      - worker-1-state:/cluster/worker-1
      - checkpoints:/checkpoints

  coordinator:
    <<: *common
    environment: &admin-environment
      <<: *worker-environment
      PARAMESH_ADMIN_TOKEN: ${PARAMESH_ADMIN_TOKEN:?Generate .env with scripts/create_dev_env.py}
    command: [coordinator, --config, examples/compose.json, --bind, '0.0.0.0:50050']
    restart: unless-stopped
    volumes: [coordinator-state:/app/state]
    healthcheck:
      test: [CMD, paramesh, status, --coordinator, '127.0.0.1:50050']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  shard-0:
    <<: *common
    environment: *admin-environment
    command: [shard, --config, examples/compose.json, --index, '0', --bind, '0.0.0.0:50051']
    restart: unless-stopped
    volumes: [shard-0-state:/app/state]
    healthcheck:
      test: [CMD, paramesh, check-shard, --address, '127.0.0.1:50051', --run-id, compose-demo]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  shard-1:
    <<: *common
    environment: *admin-environment
    command: [shard, --config, examples/compose.json, --index, '1', --bind, '0.0.0.0:50051']
    restart: unless-stopped
    volumes: [shard-1-state:/app/state]
    healthcheck:
      test: [CMD, paramesh, check-shard, --address, '127.0.0.1:50051', --run-id, compose-demo]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-0:
    <<: *common
    command: [worker, --coordinator, 'coordinator:50050', --id, worker-0, --steps, '${PARAMESH_STEPS:-20}', --step-delay, '${PARAMESH_STEP_DELAY:-0}']
    restart: on-failure
    volumes: [worker-0-state:/app/state]
    depends_on:
      coordinator: {condition: service_healthy}
      shard-0: {condition: service_healthy}
      shard-1: {condition: service_healthy}

  worker-1:
    <<: *common
    command: [worker, --coordinator, 'coordinator:50050', --id, worker-1, --steps, '${PARAMESH_STEPS:-20}', --step-delay, '${PARAMESH_STEP_DELAY:-0}']
    restart: on-failure
    volumes: [worker-1-state:/app/state]
    depends_on:
      coordinator: {condition: service_healthy}
      shard-0: {condition: service_healthy}
      shard-1: {condition: service_healthy}

networks:
  management:
  storage:
    internal: true
  training:
    internal: true

volumes:
  object-storage:
  checkpoints:
  coordinator-state:
  shard-0-state:
  shard-1-state:
  worker-0-state:
  worker-1-state:
